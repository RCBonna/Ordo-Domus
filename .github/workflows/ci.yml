name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL || 'ordo.e2e@example.com' }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_UNIT_NAME: ${{ vars.E2E_UNIT_NAME || 'Ordo E2E' }}
      E2E_UNIT_CODE: ${{ vars.E2E_UNIT_CODE || 'ORDO-E2E' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed authenticated E2E
        if: ${{ env.E2E_SUPABASE_SERVICE_ROLE_KEY != '' && env.E2E_USER_PASSWORD != '' }}
        run: npm run test:e2e:seed

      - name: E2E tests
        if: ${{ env.VITE_SUPABASE_URL != '' && env.VITE_SUPABASE_ANON_KEY != '' }}
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high
